services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.10.7.6-distroless
    environment:
    - CLICKHOUSE_PASSWORD=observability
    ports:
    - 8123:8123

  mongo:
    image: mongo:8.0.21-noble
    # environment:
    # - MONGO_INITDB_ROOT_USERNAME=root
    # - MONGO_INITDB_ROOT_PASSWORD=root
    ports:
    - 27017:27017

  hyperdx:
    image: hyperdx/hyperdx:2.24.1-amd64
    environment:
    - MONGO_URI=mongodb://mongo:27017/hyperdx
    ports:
    - 8080:8080
    depends_on:
    - mongo
  #   - clickhouse